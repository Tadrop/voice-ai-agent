name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check execution tests

      - name: Test (pytest)
        env:
          TWILIO_ACCOUNT_SID: test_sid
          TWILIO_AUTH_TOKEN: test_token
          TWILIO_PHONE_NUMBER: "+15550000000"
          OPENAI_API_KEY: test
          DEEPGRAM_API_KEY: test
          ELEVENLABS_API_KEY: test
          ELEVENLABS_VOICE_ID: test
          PUBLIC_URL: https://example.test
        run: pytest -q

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify .env and DEPLOYMENT.md are not committed
        run: |
          set -e
          if git ls-files | grep -E '(^|/)\.env$|(^|/)DEPLOYMENT\.md$|credentials\.json|token\.json' ; then
            echo "::error::Sensitive file committed. These must remain gitignored."
            exit 1
          fi
          echo "OK: no sensitive files tracked."
